<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarketLens</title>
  <link rel="stylesheet" href="desktop-start.css" />
  <script src="desktop-start.js" defer></script>
</head>
<body>
  <main aria-live="polite">
    <img src="favicon.svg" width="64" height="64" alt="" />
    <div class="brand">MarketLens</div>
    <h1>시장을 더 선명하게.</h1>
    <p id="status">저장된 설정과 데이터를 준비하고 있습니다.</p>
    <div id="progress" role="progressbar" aria-label="앱 준비 중"><span></span></div>
    <button id="retry" hidden>준비 상태 다시 확인</button>
    <small>데이터는 이 컴퓨터에 보관됩니다 · 0.1.1</small>
  </main>
</body>
</html>
