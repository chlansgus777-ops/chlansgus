name: backtest-data
# Backtest data (docs/backtest): stage 0 probes how far back each free source answers; "collect" gathers the
# point-in-time data into a SEPARATE database uploaded as an artifact (never committed; its SHA-256 is).
# "alpaca" extends a finished collection back to 2016 with Alpaca's free SIP daily bars (marketlens/backtest/alpaca.py).
# Keys come from repository secrets and are never printed. Rate limits: Polygon 5/min, SEC 10/s, FRED 2/s, Alpaca 200/min,
# Alpha Vantage 25/day (one call).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "probe | collect | alpaca | run | diagnose | freeprobe"
        required: true
        default: "probe"
      resume_run_id:
        description: "collect: continue the database of this earlier run (its backtest-db artifact); empty = start fresh. alpaca: the finished collect (or earlier alpaca) run to extend back to 2016"
        required: false
        default: ""
      data_run_id:
        description: "run: the collect run whose backtest-db artifact to measure"
        required: false
        default: ""
      run_args:
        description: "run: extra arguments for marketlens.backtest.run (e.g. --leak-checks 20)"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (lock file)
        run: pip install -r backend/requirements.lock && pip install --no-deps -e ./backend
      - name: Probe source coverage
        if: inputs.task == 'probe'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/backtest/probe_coverage.py --out probe.json
      - uses: actions/upload-artifact@v4
        if: inputs.task == 'probe'
        with:
          name: backtest-probe
          path: probe.json
      - name: Diagnose readiness gaps (app providers against the real sources)
        if: inputs.task == 'diagnose'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python scripts/diagnose_readiness.py --out diagnose.json ${{ inputs.run_args }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.task == 'diagnose'
        with:
          name: readiness-diagnose
          path: diagnose.json
      - name: Free-data feasibility probe (official free sources; secrets never printed)
        if: inputs.task == 'freeprobe'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINRA_API_KEY: ${{ secrets.FINRA_API_KEY }}
          FINRA_API_SECRET: ${{ secrets.FINRA_API_SECRET }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/freedata/probe_free_sources.py --out free_probe.json ${{ inputs.run_args }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.task == 'freeprobe'
        with:
          name: free-probe
          path: free_probe.json
      - name: Previous database (resume)
        if: (inputs.task == 'collect' || inputs.task == 'alpaca') && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: backtest-db
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect point-in-time data
        if: inputs.task == 'collect'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -f backtest.db.gz ]; then gunzip -f backtest.db.gz; fi
          python -m marketlens.backtest.collect --db backtest.db --out coverage.json --max-minutes 320
        timeout-minutes: 335
      - name: Extend back to 2016 (Alpaca SIP bars, earlier splits and dividends, SEC and FRED for the earlier years)
        if: inputs.task == 'alpaca'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          test -f backtest.db.gz || { echo "task=alpaca needs resume_run_id: the finished collect run whose backtest-db to extend"; exit 1; }
          gunzip -f backtest.db.gz
          python -m marketlens.backtest.alpaca --db backtest.db --out coverage.json --max-minutes 320
        timeout-minutes: 335
      - name: Pack the database (also after a failed or cut-off step, so the next run resumes from it)
        if: always() && (inputs.task == 'collect' || inputs.task == 'alpaca')
        run: |
          if [ -f backtest.db ]; then sha256sum backtest.db | tee backtest.db.sha256; gzip -f -k backtest.db; fi
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.task == 'collect' || inputs.task == 'alpaca')
        with:
          name: backtest-db
          path: |
            backtest.db.gz
            backtest.db.sha256
            coverage.json
          retention-days: 90
          compression-level: 0
      # ---------------------------------------------------------------- measurement (offline: no secrets, no network)
      - name: Backtest database
        if: inputs.task == 'run'
        uses: actions/download-artifact@v4
        with:
          name: backtest-db
          run-id: ${{ inputs.data_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the backtest with the network removed (the reproduction runs in the job "repro" at the same time)
        if: inputs.task == 'run'
        run: |
          gunzip -f backtest.db.gz
          sha256sum -c backtest.db.sha256
          # an empty network namespace when the runner allows one; the Python socket guard refuses connections either way
          PREFIX=""
          if unshare -rn true 2>/dev/null; then PREFIX="unshare -rn"; echo "network namespace: none (unshare -rn)"; fi
          export BACKTEST_NETNS="${PREFIX:-socket-guard-only}"
          echo "cpus: $(nproc)"
          cd backend
          $PREFIX python -m marketlens.backtest.run --db ../backtest.db --out ../bt-out ${{ inputs.run_args }}
          cd ..
          gzip -f bt-out/rows.db
      - uses: actions/upload-artifact@v4
        if: always() && inputs.task == 'run'
        with:
          name: backtest-results
          path: bt-out
          retention-days: 90
  # ---------------------------------------------------------------- reproduction: the same command, same results.json SHA-256
  repro:
    if: inputs.task == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (lock file)
        run: pip install -r backend/requirements.lock && pip install --no-deps -e ./backend
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db
          run-id: ${{ inputs.data_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reproduce (leak checks are written outside results.json, so they are skipped here)
        run: |
          gunzip -f backtest.db.gz
          sha256sum -c backtest.db.sha256
          PREFIX=""
          if unshare -rn true 2>/dev/null; then PREFIX="unshare -rn"; fi
          export BACKTEST_NETNS="${PREFIX:-socket-guard-only}"
          cd backend
          $PREFIX python -m marketlens.backtest.run --db ../backtest.db --out ../bt-out-repro --leak-checks 0 ${{ inputs.run_args }}
          rm -f ../bt-out-repro/rows.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-repro
          path: bt-out-repro
          retention-days: 90
  compare:
    if: inputs.task == 'run'
    needs: [run, repro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backtest-results
          path: bt-out
      - uses: actions/download-artifact@v4
        with:
          name: backtest-repro
          path: bt-out-repro
      - name: The reproduction gives the same results.json
        run: |
          python3 - <<'PY'
          import hashlib, json
          a = json.load(open("bt-out/manifest.json")); b = json.load(open("bt-out-repro/manifest.json"))
          ha = hashlib.sha256(open("bt-out/results.json", "rb").read()).hexdigest()
          hb = hashlib.sha256(open("bt-out-repro/results.json", "rb").read()).hexdigest()
          print("results_sha256", a["results_sha256"], ha, "reproduction", b["results_sha256"], hb)
          assert a["results_sha256"] == ha == hb == b["results_sha256"], "the reproduction gave a different results.json"
          PY
