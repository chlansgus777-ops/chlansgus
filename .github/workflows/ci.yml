name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (lock file on Linux; resolved extras on Windows)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then pip install -r backend/requirements.lock && pip install --no-deps -e ./backend; else pip install -e "./backend[dev,anthropic]"; fi
      - run: python -m pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
