name: windows-build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install backend (pinned lock file, reproducible)
        run: |
          pip install -r backend/requirements-windows.lock
          pip install --no-deps -e ./backend
      - name: Backend tests
        run: |
          pip install pytest
          python -m pytest -q backend/tests
      - name: Frontend build (desktop mode)
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build:desktop
      - name: PyInstaller sidecar
        working-directory: backend
        run: pyinstaller --noconfirm packaging/marketlens-backend.spec
      - name: Sidecar smoke test (start, readiness, single instance, port conflict)
        shell: pwsh
        env:
          MARKETLENS_MODE: MOCK
          MOCK_UNIVERSE_SIZE: "40"
          MARKETLENS_DATA_DIR: ${{ runner.temp }}\ml-smoke
        run: |
          $exe = "backend/dist/marketlens-backend.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","8799" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\smoke.out" -RedirectStandardError "$env:RUNNER_TEMP\smoke.err"
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/health/ready; if ($r.ready) { $ready = $true; break } } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { Get-Content "$env:RUNNER_TEMP\smoke.err"; throw "backend never became ready" }
          $sys = Invoke-RestMethod http://127.0.0.1:8799/api/system
          if ($sys.mode -ne "MOCK") { throw "unexpected mode $($sys.mode)" }
          # a second instance on the same data dir must refuse to start (exit 4)
          $second = Start-Process -FilePath $exe -ArgumentList "serve","--port","0" -PassThru -Wait
          if ($second.ExitCode -ne 4) { throw "second instance exit $($second.ExitCode), expected 4" }
          # another data dir asking for the busy port must fail clearly (exit 3)
          $env:MARKETLENS_DATA_DIR = "$env:RUNNER_TEMP\ml-smoke-2"
          $busy = Start-Process -FilePath $exe -ArgumentList "serve","--port","8799" -PassThru -Wait
          if ($busy.ExitCode -ne 3) { throw "busy-port exit $($busy.ExitCode), expected 3" }
          Stop-Process -Id $p.Id -Force
          Write-Host "sidecar smoke test passed"
      - name: Place sidecar
        run: Copy-Item backend/dist/marketlens-backend.exe frontend/src-tauri/binaries/marketlens-backend-x86_64-pc-windows-msvc.exe
      - name: Icons
        working-directory: frontend
        run: npx tauri icon ../docs/assets/marketlens-icon.png
      - name: Tauri bundle
        working-directory: frontend
        run: npx tauri build
      - name: Installer smoke test (silent install, launch, backend ready, UI served, clean shutdown, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not built" }
          $p0 = Start-Process $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($p0.ExitCode -ne 0) { throw "installer exit $($p0.ExitCode)" }
          $app = Get-ChildItem "$env:LOCALAPPDATA\MarketLens", "$env:LOCALAPPDATA\Programs\MarketLens", "$env:ProgramFiles\MarketLens" -Recurse -Include "MarketLens.exe","marketlens.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "installed MarketLens.exe not found" }
          Write-Host "installed at $($app.FullName)"
          $ui = Start-Process $app.FullName -PassThru
          $backend = $null
          for ($i = 0; $i -lt 60 -and -not $backend; $i++) { Start-Sleep -Seconds 2; $backend = Get-Process marketlens-backend* -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $backend) { throw "backend sidecar was not started by the app" }
          $port = $null
          for ($i = 0; $i -lt 60 -and -not $port; $i++) { Start-Sleep -Seconds 2; $port = (Get-NetTCPConnection -OwningProcess $backend.Id -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1).LocalPort }
          if (-not $port) { throw "backend is not listening" }
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) { try { $ready = (Invoke-RestMethod "http://127.0.0.1:$port/api/health/ready").ready } catch { Start-Sleep -Seconds 2 } }
          if (-not $ready) { throw "backend never became ready" }
          $html = (Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing).Content
          if ($html -notmatch "<div id=`"root`">") { throw "UI index not served" }
          try { Invoke-RestMethod "http://127.0.0.1:$port/api/system" | Out-Null; throw "API answered without the per-launch token" } catch { if ($_.Exception.Message -like "*without the per-launch token*") { throw } }
          # clean shutdown: closing the app must stop the sidecar (no orphan backend)
          $null = $ui.CloseMainWindow(); Start-Sleep -Seconds 8
          if (-not $ui.HasExited) { Stop-Process -Id $ui.Id }
          Start-Sleep -Seconds 5
          if (Get-Process -Id $backend.Id -ErrorAction SilentlyContinue) { throw "backend still running after the app exited" }
          $un = Get-ChildItem (Split-Path $app.FullName) -Filter "uninstall*.exe" | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList "/S" -Wait }
          Write-Host "installer smoke test passed (port $port)"
      - uses: actions/upload-artifact@v4
        with:
          name: marketlens-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            backend/dist/marketlens-backend.exe
