name: ktx-android
on:
  push:
    paths:
      - "ktx-android/**"
      - ".github/workflows/ktx-android.yml"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ktx-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + release APK
        run: ./gradlew --no-daemon :core:test :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "KTX-easy-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ktx-easy-apk
          path: ktx-android/KTX-easy-*.apk
          if-no-files-found: error
