name: android-build
# The MarketLens phone app (android/): a WebView of the PC's screens on the home Wi-Fi (docs/product/PHONE.md).
# Debug-signed APK for sideloading on the owner's phone; unit tests first.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests and the APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Name the APK after the build
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/MarketLens-phone.apk
          sha256sum out/MarketLens-phone.apk | tee out/MarketLens-phone.apk.sha256
          git rev-parse --short=12 HEAD > out/build_commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: marketlens-android
          path: out
          retention-days: 90
