# Thesis invalidation conditions — separate from the price stop.
# Machine-checkable conditions use a metric (see SECTOR_MODELS.md); issue-driven conditions trigger when an
# issue of the given category has a FUNDAMENTAL-horizon impact at or below issue_threshold.
version = "theses-1.0.0"

[[default]]
id = "revenue_collapse"
description = "Revenue contraction worse than -15% YoY"
metric = "revenue_growth_yoy"
operator = "<"
threshold = -0.15

[[default]]
id = "margin_structural_decline"
description = "Gross margin down more than 8pp YoY (structural decline)"
metric = "gross_margin_change_yoy"
operator = "<"
threshold = -0.08

[[ticker.NVDA]]
id = "hyperscaler_capex_cut"
description = "Hyperscaler AI capex cut"
issue_category = "AI"
issue_threshold = -40

[[ticker.NVDA]]
id = "datacenter_growth_collapse"
description = "Data-center growth collapse (total revenue growth < 0)"
metric = "revenue_growth_yoy"
operator = "<"
threshold = 0.0

[[ticker.NVDA]]
id = "gm_structural"
description = "Structural gross margin decline (> 5pp YoY)"
metric = "gross_margin_change_yoy"
operator = "<"
threshold = -0.05

[[ticker.NVDA]]
id = "regulation_worse"
description = "Export regulation materially worse"
issue_category = "Export Control"
issue_threshold = -60

[[ticker.JPM]]
id = "credit_deterioration"
description = "Credit deterioration: net charge-offs above 1.2%"
metric = "charge_off_rate"
operator = ">"
threshold = 0.012

[[ticker.JPM]]
id = "capital_shortfall"
description = "CET1 below 11%"
metric = "cet1"
operator = "<"
threshold = 0.11

[[ticker.XOM]]
id = "oil_collapse"
description = "Oil price collapse transmitted to the company"
issue_category = "Oil"
issue_threshold = -45
