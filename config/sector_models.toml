# MarketLens sector models — version controlled. Values are fractions (0.20 = 20%).
# bad → subscore 0, good → subscore 1 (linear). If good < bad, lower is better.
version = "sector-models-1.0.0"

[[model]]
id = "semiconductor"
name = "Semiconductor"
sectors = []
industry_keywords = ["semiconductor"]
primary_multiple = "forward_pe"
rationale = "cyclical, capex/inventory driven; margins and end-market demand dominate"
fundamental = [
  { metric = "revenue_growth_yoy", label = "Revenue growth YoY", weight = 3, bad = -0.10, good = 0.40 },
  { metric = "eps_growth_yoy", label = "EPS growth YoY", weight = 2, bad = -0.20, good = 0.50 },
  { metric = "gross_margin", label = "Gross margin", weight = 2, bad = 0.35, good = 0.65 },
  { metric = "gross_margin_change_yoy", label = "Gross margin change YoY", weight = 1, bad = -0.05, good = 0.05 },
  { metric = "fcf_margin", label = "FCF margin", weight = 2, bad = 0.0, good = 0.35 },
  { metric = "inventory_vs_revenue_growth", label = "Inventory growth minus revenue growth", weight = 1.5, bad = 0.25, good = -0.10 },
  { metric = "capex_to_revenue", label = "CapEx / revenue", weight = 0.5, bad = 0.35, good = 0.05 },
  { metric = "ai_revenue_share", label = "AI end-market share of revenue", weight = 1, bad = 0.0, good = 0.5 },
]
valuation = [
  { metric = "forward_pe", label = "Forward P/E", weight = 3, bad = 60, good = 15 },
  { metric = "peg", label = "PEG", weight = 3, bad = 3.0, good = 0.8 },
  { metric = "ev_sales", label = "EV/Sales", weight = 1, bad = 25, good = 3 },
  { metric = "fcf_yield", label = "FCF yield", weight = 1, bad = 0.005, good = 0.06 },
]

