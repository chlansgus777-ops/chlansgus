# MarketLens model configuration — every change must bump the relevant version.
scoring_model_version = "scoring-2.0.0"   # 2.0.0: coverage-blended components, point-in-time freshness inputs
decision_model_version = "decision-3.0.0" # 3.0.0: model-coverage veto, missing data neutral for REDUCE/SELL; 2.0.0: stale-core veto, portfolio gate, ADD R/R, prior-stop, sector-unknown
config_version = "config-2.1.0"           # 2.1.0: calibration auto_promote=false; 2.0.0: per-type freshness rules, paper account limits

[scoring.weights]            # points; normalised to 0-100
fundamental = 25
valuation = 15
earnings_revision = 15
catalyst = 10
macro = 10
technical = 10
risk = 10
entry_rr = 15

[scoring]
missing_component_subscore = 0.35   # conservative value for a component with no data (flagged)

[decision]
buy_enter = 80
buy_exit = 76
buy_small_enter = 72
buy_small_exit = 68
watch_floor = 55
hold_floor = 55
reduce_floor = 45
min_completeness = 0.6
min_liquidity_dollar_volume = 20000000
material_score_delta = 5.0
material_rr_delta = 0.5
material_revision_delta = 0.02
committee_max_confidence_adjustment = 10.0
min_rr = 2.0

[entry]
min_rr = 2.0
stop_atr_buffer = 0.5
max_stop_atr = 3.0
fallback_stop_atr = 2.0
min_target_atr = 1.0
fallback_target1_atr = 3.0
fallback_target2_atr = 5.0
ideal_entry_atr_above_support = 0.25
add_zone_atr = 0.5

[freshness]
realtime_max_age_seconds = 120
delayed_max_age_seconds = 1200

# Per data type: FRESH up to fresh_max, usable (DELAYED, lower confidence) up to usable_max, then STALE.
# price_history / options are in NYSE sessions, the rest in calendar days (see domain/freshness.py).
[freshness.rules.price_history]
fresh_max = 1
usable_max = 3
[freshness.rules.fundamentals]
fresh_max = 190      # a 10-K can arrive 90 days after FY end → the prior Q3 is ~181 days old until then
usable_max = 280
[freshness.rules.earnings]
fresh_max = 110
usable_max = 200
[freshness.rules.analyst]
fresh_max = 7
usable_max = 30
[freshness.rules.short_interest]
fresh_max = 30
usable_max = 45

[scanner]
min_price = 5.0
min_market_cap = 1000000000
min_avg_dollar_volume = 20000000
include_etfs = false
stage2_keep = 400
stage3_keep = 150
stage4_keep = 60
final_candidates = 40
ai_committee_top_n = 20      # Tier 1: LIGHT review (5 LLM calls) for ranks 6..20
committee_full_top_n = 5     # Tier 2: FULL committee (14 LLM calls) for the top 5; the user can request FULL on any stock page
estimate_top_n = 20          # Alpha Vantage free tier ≈ 25 requests/day: only final candidates, cached for days
estimate_daily_budget = 22
estimate_ttl_days = 3

[scanner.stage2_weights]     # cheap quant filter (fundamental-first; technicals are minor)
revenue_growth = 0.18
eps_growth = 0.14
eps_revision = 0.20
relative_strength = 0.08
volume_trend = 0.04
distance_from_52w_high = 0.06
forward_pe = 0.10
fcf_yield = 0.10
liquidity = 0.05
volatility = 0.05

[issues]
max_hops = 2
decay_direct = 1.0
decay_one_hop = 0.65
decay_two_hop = 0.35
major_importance = 0.7

[event_risk]
earnings_window_days = 5
binary_window_days = 3
extreme_expected_move = 0.15
high_expected_move = 0.08

[portfolio]
max_single_name = 0.10
max_sector = 0.30
max_theme = 0.40
high_correlation = 0.75
full_position = 0.05
half_position = 0.025
small_position = 0.0125

[paper]
slippage_bps = 5.0
default_half_spread_bps = 2.0
max_holding_days = 60
t1_exit_fraction = 0.5
position_notional = 10000
starting_capital = 100000
max_position_weight = 0.10
max_open_positions = 25

[calibration]
min_samples = 100
max_weight_change = 0.05
horizon = 20
min_ic_improvement = 0.01
min_shadow_samples = 100
min_segment_samples = 60
auto_promote = false  # a shadow model that passes every check is only PROMOTION_ELIGIBLE; a person approves it

[evaluation]
min_ic_samples = 30
min_period_samples = 5
min_ic_periods = 5

[cache_ttl_seconds]
price = 15
bars = 3600
news = 300
fundamentals = 86400
macro = 3600
analyst = 21600
options = 900
universe = 86400
