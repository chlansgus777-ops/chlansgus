[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.1.0"
description = "MarketLens — US equity investment decision-support system (no order execution)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.1",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
keyring = ["keyring>=24"]
anthropic = ["anthropic>=1.0"]
windows = ["pyinstaller>=6"]

[project.scripts]
marketlens = "marketlens.workers.cli:main"

[tool.setuptools.packages.find]
include = ["marketlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
